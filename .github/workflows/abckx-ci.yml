name: abckx-ci

on:
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to validate
        required: true
        type: string
  pull_request:
    branches: [abckx]
  push:
    branches: [abckx]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: authelia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: authelia
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: authelia/go.mod
          cache-dependency-path: authelia/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.12.1'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.18.0'
          run_install: false
      - name: Locate pnpm store
        id: pnpm-store
        run: printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-12-${{ hashFiles('authelia/web/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-12-
      - name: Fork build contracts
        run: python3 -m unittest discover -s abckx -v
      - name: Install locked web dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Typecheck and test the complete portal
        working-directory: authelia/web
        env:
          CI: 'true'
        run: |
          pnpm exec tsc --noEmit
          pnpm test
      # Run before Vite replaces the server's tracked test placeholders.
      - name: Test the complete upstream Go unit suite and fork packages
        run: go test -coverprofile=coverage.txt -covermode=atomic -race $(go list ./... | grep -v suites)
      - name: Build the frontend and backend
        working-directory: authelia/web
        run: |
          pnpm build
          cd ..
          rm -rf internal/server/public_html/api
          cp -R api internal/server/public_html/api
          go build -trimpath -o "$RUNNER_TEMP/authelia" ./cmd/authelia
      - name: Required validation summary
        if: always()
        env:
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Required for merge: fork build and full unit suites\n\n'
            printf 'Result: %s\n\n' "$VALIDATION_STATUS"
            printf '%s\n' '- Full upstream Go units: atomic coverage and race detector; upstream excludes internal/suites integration tests.'
            printf '%s\n' '- Full web units: CI=true pnpm test (coverage), TypeScript check, portal and Go builds.'
            printf '%s\n' '- Fork contracts also run. No test failures are ignored. Image/browser smoke is a separate workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
