name: abckx-image

on:
  push:
    branches: [abckx]
    tags: ['abckx-v*']
  pull_request:
    branches: [abckx]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: version
        name: Identify the source build
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/authelia" >> "$GITHUB_OUTPUT"
          version="abckx-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/tags/abckx-v* ]]; then
            version="${GITHUB_REF_NAME#abckx-v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/abckx-v') }}
      - name: Build and load for runtime validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: abckx/Dockerfile
          load: true
          push: false
          tags: authelia-smoke:local
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify non-root, version and branding HTML
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python3 abckx/image-smoke.py --image authelia-smoke:local
      - name: Login for publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/abckx' || startsWith(github.ref, 'refs/tags/abckx-v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the validated image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/abckx' || startsWith(github.ref, 'refs/tags/abckx-v'))
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag authelia-smoke:local "$tag"
            docker push "$tag"
          done <<< "$TAGS"
